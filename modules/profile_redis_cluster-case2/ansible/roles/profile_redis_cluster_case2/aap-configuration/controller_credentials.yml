---
controller_credentials:
  - name: Redis Authentication Password - profile_redis_cluster_case2
    description: Redis requirepass authentication password used to secure the Redis instance
    organization: Default
    credential_type: Redis Authentication Password
    update_secrets: true
    inputs:
      redis_password: "{{ vault_redis_password }}"
  - name: Company Internal Secret Store Service Token - profile_redis_cluster_case2
    description: Proprietary internal secret store credential used to fetch the Redis service token via CompanyInternal::SecretStore
    organization: Default
    credential_type: Company Internal Secret Store Service Token
    update_secrets: true
    inputs:
      redis_service_token: "{{ vault_redis_service_token }}"
