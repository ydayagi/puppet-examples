---
controller_credentials:
  - name: Redis Password - profile_redis_cluster_case2
    description: Redis server authentication password used in redis.conf requirepass directive
    organization: Default
    credential_type: Redis Password
    update_secrets: true
    inputs:
      redis_password: "{{ vault_redis_password }}"
  - name: Company Internal Secret Store Service Token - profile_redis_cluster_case2
    description: Proprietary internal secret store credential used to fetch the redis_service_token via mySecretFunction1 / CompanyInternal::SecretStore
    organization: Default
    credential_type: Company Internal Secret Store Service Token
    update_secrets: true
    inputs:
      secret_store_url: "{{ secret_store_url }}"
      secret_store_token: "{{ vault_secret_store_token }}"
      redis_service_token: "{{ vault_redis_service_token }}"
