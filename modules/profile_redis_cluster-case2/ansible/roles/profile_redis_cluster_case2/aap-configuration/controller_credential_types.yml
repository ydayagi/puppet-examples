---
controller_credential_types:
  - name: Redis Authentication Password
    description: Redis requirepass authentication password used to secure the Redis instance
    kind: cloud
    inputs:
      fields:
        - id: redis_password
          type: string
          label: Redis Password
          secret: true
          help_text: The Redis authentication password set via 'requirepass' in redis.conf. Currently defaults to 'CHANGEME' — must be replaced with a secure 
            value before deployment.
      required:
        - redis_password
    injectors:
      extra_vars:
        redis_password: !unsafe "{{ redis_password }}"
  - name: Company Internal Secret Store Service Token
    description: Proprietary internal secret store credential used to fetch the Redis service token via CompanyInternal::SecretStore
    kind: cloud
    inputs:
      fields:
        - id: redis_service_token
          type: string
          label: Redis Service Token
          secret: true
          help_text: "The service token fetched from CompanyInternal::SecretStore under the key 'redis_service_token'. Retrieved at Puppet compile time via mySecretFunction1;
            must use no_log: true in any consuming Ansible task."
      required:
        - redis_service_token
    injectors:
      extra_vars:
        redis_service_token: !unsafe "{{ redis_service_token }}"
