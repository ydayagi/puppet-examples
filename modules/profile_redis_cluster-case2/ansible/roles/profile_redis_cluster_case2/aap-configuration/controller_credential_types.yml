---
controller_credential_types:
  - name: Redis Password
    description: Redis server authentication password used in redis.conf requirepass directive
    kind: cloud
    inputs:
      fields:
        - id: redis_password
          type: string
          label: Redis Password
          secret: true
          help_text: The Redis requirepass password. Defaults to 'CHANGEME' in the Puppet manifest — must be replaced with a vaulted value before any 
            deployment.
      required:
        - redis_password
    injectors:
      extra_vars:
        redis_password: !unsafe "{{ redis_password }}"
  - name: Company Internal Secret Store Service Token
    description: Proprietary internal secret store credential used to fetch the redis_service_token via mySecretFunction1 / CompanyInternal::SecretStore
    kind: cloud
    inputs:
      fields:
        - id: secret_store_url
          type: string
          label: Secret Store URL
          help_text: Connection URL or endpoint for the CompanyInternal::SecretStore backend (e.g., HashiCorp Vault address, AWS Secrets Manager endpoint, or 
            proprietary store URL). Must be confirmed with the Platform Team.
        - id: secret_store_token
          type: string
          label: Secret Store Authentication Token
          secret: true
          help_text: Authentication token or credential used to authenticate against the CompanyInternal::SecretStore backend. Exact field depends on the 
            confirmed backend (e.g., Vault token, AWS access key, etc.).
        - id: redis_service_token
          type: string
          label: Redis Service Token
          secret: true
          help_text: The secret value fetched by mySecretFunction1('redis_service_token') from CompanyInternal::SecretStore. Used as the service token for the 
            Redis node — likely passed to mySecretType1 or the redis class.
      required:
        - redis_service_token
    injectors:
      extra_vars:
        secret_store_url: !unsafe "{{ secret_store_url }}"
        secret_store_token: !unsafe "{{ secret_store_token }}"
        redis_service_token: !unsafe "{{ redis_service_token }}"
