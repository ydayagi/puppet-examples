---
# Play 1: Verify filesystem state — config, log dir, myapp deployment, health check file
- name: Verify filesystem state
  hosts: all
  gather_facts: false
  tasks:
    - name: Stat key filesystem paths
      ansible.builtin.stat:
        path: "{{ item_path }}"  # noqa: R114 - paths are fixed literals from role-defined defaults, not user input
      loop:
        - /etc/redis/redis.conf
        - /var/log/redis
        - /opt/myapp
        - /opt/myapp/version.txt
        - /var/lib/redis/health_check.json
      loop_control:
        loop_var: item_path
      register: _fs_stat_results

    - name: Assert all expected paths exist
      ansible.builtin.assert:
        that:
          - item_stat['stat']['exists']
        fail_msg: "Expected path does not exist"
      loop: "{{ _fs_stat_results['results'] }}"
      loop_control:
        loop_var: item_stat

    - name: Assert Redis config file is a regular file with correct mode
      ansible.builtin.assert:
        that:
          - _fs_stat_results['results'][0]['stat']['isreg']
          - _fs_stat_results['results'][0]['stat']['mode'] == '0640'
        fail_msg: "Redis config file missing or has wrong mode"

    - name: Assert Redis log directory has correct type, owner, group, and mode
      ansible.builtin.assert:
        that:
          - _fs_stat_results['results'][1]['stat']['isdir']
          - _fs_stat_results['results'][1]['stat']['pw_name'] == 'redis'
          - _fs_stat_results['results'][1]['stat']['gr_name'] == 'redis'
          - _fs_stat_results['results'][1]['stat']['mode'] == '0755'
        fail_msg: "Redis log directory missing or has wrong ownership/mode"

    - name: Assert myapp install directory exists
      ansible.builtin.assert:
        that:
          - _fs_stat_results['results'][2]['stat']['isdir']
        fail_msg: "myapp install directory /opt/myapp does not exist"

    - name: Assert myapp version.txt exists and is a regular file
      ansible.builtin.assert:
        that:
          - _fs_stat_results['results'][3]['stat']['isreg']
          - _fs_stat_results['results'][3]['stat']['size'] > 0
        fail_msg: "myapp version.txt is missing or empty"

    - name: Assert health check JSON file exists and is non-empty
      ansible.builtin.assert:
        that:
          - _fs_stat_results['results'][4]['stat']['isreg']
          - _fs_stat_results['results'][4]['stat']['size'] > 0
        fail_msg: "Health check JSON file is missing or empty"

    - name: Assert health check JSON file has correct owner, group, and mode
      ansible.builtin.assert:
        that:
          - _fs_stat_results['results'][4]['stat']['pw_name'] == 'redis'
          - _fs_stat_results['results'][4]['stat']['gr_name'] == 'redis'
          - _fs_stat_results['results'][4]['stat']['mode'] == '0644'
        fail_msg: "Health check JSON file has wrong ownership or mode"

    - name: Read myapp version.txt content
      ansible.builtin.slurp:
        src: /opt/myapp/version.txt
      register: _myapp_version_content

    - name: Assert myapp version.txt contains expected version
      ansible.builtin.assert:
        that:
          - (_myapp_version_content['content'] | b64decode | trim) == '2.1.0'
        fail_msg: "myapp version.txt does not contain expected version 2.1.0"

    - name: Read health check JSON file content
      ansible.builtin.slurp:
        src: /var/lib/redis/health_check.json
      register: _health_check_content

    - name: Assert health check file contains valid JSON
      ansible.builtin.assert:
        that:
          - (_health_check_content['content'] | b64decode | from_json) is mapping or
            (_health_check_content['content'] | b64decode | from_json) is iterable
        fail_msg: "Health check file does not contain valid JSON"

# Play 2: Verify Redis service and network state
- name: Verify Redis service and network
  hosts: all
  gather_facts: false
  tasks:
    - name: Gather service facts
      ansible.builtin.service_facts:

    - name: Assert Redis service is present in service facts
      ansible.builtin.assert:
        that:
          - "'redis.service' in ansible_facts['services'] or 'redis' in ansible_facts['services']"
        fail_msg: "Redis service not found in service facts"

    - name: Assert Redis service is running and enabled
      ansible.builtin.assert:
        that:
          - >-
            (ansible_facts['services']['redis.service']['state'] | default('')) == 'running' or
            (ansible_facts['services']['redis']['state'] | default('')) == 'running'
          - >-
            (ansible_facts['services']['redis.service']['status'] | default('')) == 'enabled' or
            (ansible_facts['services']['redis']['status'] | default('')) == 'enabled'
        fail_msg: "Redis service is not running or not enabled"

    - name: Assert Redis is listening on port 6379
      ansible.builtin.wait_for:
        host: 127.0.0.1
        port: 6379
        state: started
        timeout: 10

    - name: Read Redis config and assert key directives are present
      ansible.builtin.slurp:
        src: /etc/redis/redis.conf
      register: _redis_conf_content

    - name: Assert Redis config contains bind directive
      ansible.builtin.assert:
        that:
          - "'bind 0.0.0.0' in (_redis_conf_content['content'] | b64decode)"
        fail_msg: "Redis config does not contain expected bind directive"

    - name: Assert Redis config contains port directive
      ansible.builtin.assert:
        that:
          - "'port 6379' in (_redis_conf_content['content'] | b64decode)"
        fail_msg: "Redis config does not contain expected port directive"

    - name: Assert Redis config contains maxmemory directive
      ansible.builtin.assert:
        that:
          - "'maxmemory 2048mb' in (_redis_conf_content['content'] | b64decode)"
        fail_msg: "Redis config does not contain expected maxmemory directive"

    - name: Assert Redis config contains maxmemory-policy directive
      ansible.builtin.assert:
        that:
          - "'maxmemory-policy allkeys-lru' in (_redis_conf_content['content'] | b64decode)"
        fail_msg: "Redis config does not contain expected maxmemory-policy directive"

    - name: Assert Redis config contains appendonly directive
      ansible.builtin.assert:
        that:
          - "'appendonly yes' in (_redis_conf_content['content'] | b64decode)"
        fail_msg: "Redis config does not contain expected appendonly directive"

    - name: Assert Redis config contains appendfsync directive
      ansible.builtin.assert:
        that:
          - "'appendfsync everysec' in (_redis_conf_content['content'] | b64decode)"
        fail_msg: "Redis config does not contain expected appendfsync directive"
