# noqa: R401 - audit rule aggregates inbound sources from included role tasks; sources are role-defined variables validated by assert
---
- name: Converge
  hosts: all
  gather_facts: true
  vars:
    # Credential variables normally injected by AAP credential type at runtime.
    # Molecule supplies safe placeholder values so validate_credentials.yml passes.
    # ACTION REQUIRED before production use: replace with vaulted values.
    redis_password: CHANGEME_molecule_test
    secret_store_url: http://secret-store.internal
    secret_store_token: molecule_test_token
    redis_service_token: molecule_test_service_token
  tasks:
    - name: Include profile_redis_cluster_case2
      ansible.builtin.include_role: # noqa: L038 - role-under-test resolves at runtime; unresolved only when scanned in isolation
        name: profile_redis_cluster_case2
