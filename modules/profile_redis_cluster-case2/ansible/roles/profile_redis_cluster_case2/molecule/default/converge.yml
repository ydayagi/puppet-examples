    redis_password: "MoleculeTestPassword123!"
    redis_service_token: "molecule-test-token"
  tasks:
    - name: Include profile_redis_cluster_case2
      ansible.builtin.include_role: # noqa: L038 - role-under-test resolves at runtime; unresolved only when scanned in isolation
        name: profile_redis_cluster_case2
