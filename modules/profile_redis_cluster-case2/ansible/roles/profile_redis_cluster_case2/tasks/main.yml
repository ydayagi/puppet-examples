---
# profile_redis_cluster_case2 — main task entry point
# Equivalent of manifests/init.pp

- name: Validate AAP credential variables
  ansible.builtin.include_tasks: validate_credentials.yml
# Detect Redis role (primary or replica) — equivalent of custom Facter fact redis_role

- name: Detect Redis cluster role
  ansible.builtin.include_tasks: detect_redis_role.yml
# Install and configure Redis — equivalent of profile_redis_cluster_case2::install

- name: Install and configure Redis
  ansible.builtin.include_tasks: install.yml
# Deploy myapp companion artifact — equivalent of myDeploy1 'myapp'

- name: Deploy myapp companion application
  ansible.builtin.include_tasks: deploy_myapp.yml
# Fetch health check JSON and write to disk — equivalent of myFunction1 + file resource

- name: Fetch and persist health check snapshot
  ansible.builtin.include_tasks: health_check.yml
# Fetch service token from secret store — NOT SAFELY CONVERTIBLE (see task file for details)

- name: Fetch service token from secret store
  ansible.builtin.include_tasks: fetch_secret.yml
# Register node with Enterprise Scheduler — NOT SAFELY CONVERTIBLE (see task file for details)

- name: Register node with Enterprise Scheduler
  ansible.builtin.include_tasks: scheduler_registration.yml
# NOTE: PuppetDB peer discovery ($redis_nodes) has no direct Ansible equivalent.
# Use Ansible inventory groups for cluster peer discovery:
#   groups['redis_cluster'] provides the list of all Redis cluster peer hostnames.
# If the Redis configuration requires a peer list, template it from:
#   {{ groups['redis_cluster'] | default([]) }}
