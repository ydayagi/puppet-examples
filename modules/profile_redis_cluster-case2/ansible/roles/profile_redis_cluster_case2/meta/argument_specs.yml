---
argument_specs:
  main:
    short_description: Install and configure a Redis cluster node with companion application deployment
    description:
      - Installs and configures Redis with password authentication, memory limits, and append-only persistence.
      - Deploys the myapp companion application artifact from an internal artifact server.
      - Fetches a health check JSON snapshot from a local HTTP endpoint and writes it to disk.
      - Detects the Redis cluster role (primary or replica) based on replica config file presence.
      - Includes placeholder tasks for Enterprise Scheduler registration and secret store fetching that require developer investigation before implementation.
    options:
      profile_redis_cluster_case2_redis_port:
        type: int
        required: false
        default: 6379
        description: TCP port Redis listens on.
      profile_redis_cluster_case2_maxmemory_mb:
        type: int
        required: false
        default: 2048
        description: Maximum memory Redis may use, in megabytes.
      profile_redis_cluster_case2_maxmemory_policy:
        type: str
        required: false
        default: allkeys-lru
        description: Redis eviction policy when maxmemory is reached.
      profile_redis_cluster_case2_redis_bind:
        type: str
        required: false
        default: 0.0.0.0
        description: IP address Redis binds to. Defaults to all interfaces.
      profile_redis_cluster_case2_appendonly:
        type: bool
        required: false
        default: true
        description: Whether to enable Redis append-only persistence mode.
      profile_redis_cluster_case2_appendfsync:
        type: str
        required: false
        default: everysec
        description: >-
          Redis appendfsync policy. Valid values are 'always', 'everysec', or 'no'.
      profile_redis_cluster_case2_myapp_version:
        type: str
        required: false
        default: 2.1.0
        description: Version of the myapp companion application to deploy.
      profile_redis_cluster_case2_myapp_url:
        type: str
        required: false
        default: http://artifacts.internal/myapp-2.1.0.tar.gz
        description: URL of the myapp artifact tarball to download.
      profile_redis_cluster_case2_myapp_install_dir:
        type: str
        required: false
        default: /opt/myapp
        description: Directory where myapp is installed.
      profile_redis_cluster_case2_health_check_url:
        type: str
        required: false
        default: http://localhost:8080/health
        description: URL of the local health check HTTP endpoint to query.
      profile_redis_cluster_case2_health_check_dest:
        type: str
        required: false
        default: /var/lib/redis/health_check.json
        description: Filesystem path where the health check JSON snapshot is written.
      profile_redis_cluster_case2_log_dir:
        type: str
        required: false
        default: /var/log/redis
        description: Redis log directory path.
      profile_redis_cluster_case2_replica_conf:
        type: str
        required: false
        default: /etc/redis/conf.d/replica.conf
        description: >-
          Path to the Redis replica configuration file. If this file exists and contains
          'replicaof', the node is identified as a replica; otherwise it is a primary.
      profile_redis_cluster_case2_secure_logging:
        type: bool
        required: false
        default: true
        description: >-
          Controls no_log on tasks that handle secret credentials (redis_password,
          redis_service_token, secret_store_token). Set to false only for debugging.
      redis_password:
        type: str
        required: true
        description: >-
          Redis requirepass password. Injected at runtime by the AAP credential type.
          Must NOT be stored in plaintext — use Ansible Vault or AAP credential injection.
      redis_service_token:
        type: str
        required: true
        description: >-
          Service token for the Enterprise Scheduler / secret store integration.
          Injected at runtime by the AAP credential type.
      secret_store_url:
        type: str
        required: true
        description: >-
          URL of the internal secret store backend (CompanyInternal::SecretStore).
          Injected at runtime by the AAP credential type.
      secret_store_token:
        type: str
        required: true
        description: >-
          Authentication token for the internal secret store backend.
          Injected at runtime by the AAP credential type.
