---
controller_credential_types:
  - name: Redis Password
    description: Redis authentication password used for requirepass directive in redis.conf
    kind: cloud
    inputs:
      fields:
        - id: redis_password
          type: string
          label: Redis Password
          secret: true
          help_text: The Redis requirepass password. Currently defaults to plaintext 'CHANGEME' — must be vault-encrypted before production use. Rendered into 
            redis.conf as 'requirepass <value>'.
      required:
        - redis_password
    injectors:
      extra_vars:
        redis_password: !unsafe "{{ redis_password }}"
  - name: CompanyInternal SecretStore Service Token
    description: Proprietary internal secret store credential for fetching the redis_service_token via CompanyInternal::SecretStore (company_internal_lib Ruby 
      gem)
    kind: cloud
    inputs:
      fields:
        - id: redis_service_token
          type: string
          label: Redis Service Token
          secret: true
          help_text: The named secret 'redis_service_token' fetched from CompanyInternal::SecretStore via mySecretFunction1. The underlying backend (HashiCorp 
            Vault, CyberArk, AWS Secrets Manager, etc.) is unknown and must be identified before migration can proceed.
        - id: secret_store_endpoint
          type: string
          label: Secret Store Endpoint URL
          help_text: The API endpoint URL for the CompanyInternal::SecretStore backend. Must be documented by the team before the Ansible lookup plugin can be 
            implemented.
        - id: secret_store_api_token
          type: string
          label: Secret Store API Token
          secret: true
          help_text: Authentication token or credential required to authenticate against the CompanyInternal::SecretStore backend API.
      required:
        - redis_service_token
    injectors:
      extra_vars:
        redis_service_token: !unsafe "{{ redis_service_token }}"
        secret_store_endpoint: !unsafe "{{ secret_store_endpoint }}"
        secret_store_api_token: !unsafe "{{ secret_store_api_token }}"
