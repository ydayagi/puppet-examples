---
controller_credentials:
  - name: Redis Password - profile_redis_cluster_case3
    description: Redis authentication password used for requirepass directive in redis.conf
    organization: Default
    credential_type: Redis Password
    update_secrets: true
    inputs:
      redis_password: "{{ vault_redis_password }}"
  - name: CompanyInternal SecretStore Service Token - profile_redis_cluster_case3
    description: Proprietary internal secret store credential for fetching the redis_service_token via CompanyInternal::SecretStore (company_internal_lib Ruby 
      gem)
    organization: Default
    credential_type: CompanyInternal SecretStore Service Token
    update_secrets: true
    inputs:
      redis_service_token: "{{ vault_redis_service_token }}"
      secret_store_endpoint: "{{ secret_store_endpoint }}"
      secret_store_api_token: "{{ vault_secret_store_api_token }}"
