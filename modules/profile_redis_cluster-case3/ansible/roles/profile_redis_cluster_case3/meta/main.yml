galaxy_info:
  role_name: profile_redis_cluster_case3
  namespace: x2a
  author: Platform Team
  description: >-
    Redis cluster profile: installs and configures Redis (bind 0.0.0.0, port 6379,
    password-protected, AOF persistence, 2048mb memory cap with allkeys-lru eviction),
