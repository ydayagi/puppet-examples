---
# Redis cluster configuration
redis_cluster_redis_port: 6379
# redis_password is injected by AAP credential type at runtime (secret)
redis_cluster_maxmemory_mb: 2048
redis_cluster_maxmemory_policy: allkeys-lru
# Redis service name (OS-specific, overridden in vars/)
redis_cluster_service_name: redis-server
redis_cluster_package_name: redis-server
# Redis paths
redis_cluster_config_file: /etc/redis/redis.conf
redis_cluster_log_dir: /var/log/redis
redis_cluster_data_dir: /var/lib/redis
redis_cluster_pid_dir: /var/run/redis
# myapp deployment
redis_cluster_myapp_version: 2.1.0
redis_cluster_myapp_url: http://artifacts.internal/myapp-2.1.0.tar.gz
redis_cluster_myapp_install_dir: /opt/myapp
# CompanyApp settings file
redis_cluster_company_app_conf: /etc/company/app.conf
# Health check endpoint
redis_cluster_health_check_url: http://localhost:8080/health
redis_cluster_health_check_dest: /var/lib/redis/health_check.json
# Secure logging toggle — set to false only for debugging
redis_cluster_case3_secure_logging: true
