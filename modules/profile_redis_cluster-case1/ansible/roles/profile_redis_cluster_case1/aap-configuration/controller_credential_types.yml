---
controller_credential_types:
  - name: Redis Cluster Password
    description: Redis authentication password for the cluster node, currently stored as a plaintext default and must be migrated to Ansible Vault or an 
      external secrets manager
    kind: cloud
    inputs:
      fields:
        - id: redis_password
          type: string
          label: Redis Password
          secret: true
          help_text: The Redis requirepass value used to authenticate connections to the Redis instance on port 6379. Currently defaults to 'CHANGEME' — must be
            rotated and stored securely before production use.
      required:
        - redis_password
    injectors:
      extra_vars:
        redis_password: !unsafe "{{ redis_password }}"
