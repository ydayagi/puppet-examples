---
controller_credentials:
  - name: Redis Cluster Password - profile_redis_cluster_case1
    description: Redis authentication password for the cluster node, currently stored as a plaintext default and must be migrated to Ansible Vault or an 
      external secrets manager
    organization: Default
    credential_type: Redis Cluster Password
    update_secrets: true
    inputs:
      redis_password: "{{ vault_redis_password }}"
