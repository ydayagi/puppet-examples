---
controller_credentials:
  - name: Redis Password - profile_redis_cluster_case3
    description: Redis requirepass password used to authenticate clients connecting to the Redis service
    organization: Default
    credential_type: Redis Password
    update_secrets: true
    inputs:
      redis_password: "{{ vault_redis_password }}"
  - name: CompanyInternal SecretStore Redis Service Token - profile_redis_cluster_case3
    description: Service token for the Redis node fetched from the proprietary CompanyInternal::SecretStore via mySecretFunction1. Backend is unknown and must
      be identified before migration.
    organization: Default
    credential_type: CompanyInternal SecretStore Redis Service Token
    update_secrets: true
    inputs:
      redis_service_token: "{{ vault_redis_service_token }}"
