---
controller_credential_types:
  - name: Redis Password
    description: Redis requirepass password used to authenticate clients connecting to the Redis service
    kind: cloud
    inputs:
      fields:
        - id: redis_password
          type: string
          label: Redis Password
          secret: true
          help_text: The Redis requirepass password injected into redis.conf via the 'requirepass' directive. Defaults to insecure plaintext 'CHANGEME' — must
            be replaced with a vault-managed secret before production use.
      required:
        - redis_password
    injectors:
      extra_vars:
        redis_password: !unsafe "{{ redis_password }}"
  - name: CompanyInternal SecretStore Redis Service Token
    description: Service token for the Redis node fetched from the proprietary CompanyInternal::SecretStore via mySecretFunction1. Backend is unknown and must
      be identified before migration.
    kind: cloud
    inputs:
      fields:
        - id: redis_service_token
          type: string
          label: Redis Service Token
          secret: true
          help_text: Named secret 'redis_service_token' retrieved from CompanyInternal::SecretStore at Puppet catalog compile time via
            mySecretFunction1('redis_service_token'). The actual secrets backend (HashiCorp Vault, AWS Secrets Manager, CyberArk, or custom API) must be
            confirmed with the Platform/Security team before selecting the Ansible lookup plugin.
      required:
        - redis_service_token
    injectors:
      extra_vars:
        redis_service_token: !unsafe "{{ redis_service_token }}"
