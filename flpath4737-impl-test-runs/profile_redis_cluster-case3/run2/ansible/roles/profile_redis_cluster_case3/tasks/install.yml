---
# Converted from: ../../site/modules/linux/profile_redis_cluster/manifests/install.pp
# Installs and configures the Redis service, and ensures the log directory exists.
# The community Puppet 'redis' class is replaced by direct package/template/service tasks.

- name: Install redis package
  ansible.builtin.package:
    name: redis
    state: present

- name: Ensure Redis log directory exists
  ansible.builtin.file:
    path: "{{ profile_redis_cluster_case3_log_dir }}" # noqa: R114 - path from role-defined variable, not user input
    state: directory
    owner: redis
    group: redis
    mode: "0755"

- name: Ensure Redis data directory exists
  ansible.builtin.file:
    path: /var/lib/redis
    state: directory
    owner: redis
    group: redis
    mode: "0750"

- name: Deploy Redis configuration file
  ansible.builtin.template:
    src: redis.conf.j2
    dest: /etc/redis/redis.conf
    owner: redis
    group: redis
    mode: "0640"
    backup: true
  notify: Restart redis
  no_log: "{{ profile_redis_cluster_case3_secure_logging }}"

- name: Ensure Redis service is running and enabled
  ansible.builtin.service:
    name: redis
    state: started
    enabled: true
