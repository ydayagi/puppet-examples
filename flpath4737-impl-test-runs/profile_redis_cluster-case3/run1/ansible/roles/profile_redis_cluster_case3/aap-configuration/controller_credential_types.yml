---
controller_credential_types:
  - name: Company Internal Secret Store Redis Password
    description: Redis server password sourced from the proprietary CompanyInternal::SecretStore, replacing the hardcoded 'CHANGEME' plaintext default. The 
      actual backend (Vault, AWS Secrets Manager, etc.) must be confirmed with the platform/security team.
    kind: cloud
    inputs:
      fields:
        - id: redis_password
          type: string
          label: Redis Password
          secret: true
          help_text: Password for the Redis server (requirepass directive). Replaces the hardcoded 'CHANGEME' default in manifests/init.pp and redis.conf.erb. 
            Must be sourced exclusively from a secrets backend — never from a plaintext variable file or inventory.
      required:
        - redis_password
    injectors:
      extra_vars:
        redis_password: !unsafe "{{ redis_password }}"
  - name: Company Internal Secret Store Redis Service Token
    description: Service token named 'redis_service_token' fetched at catalog compile time via mySecretFunction1('redis_service_token') from 
      CompanyInternal::SecretStore. The downstream consumer (myapp or another on-node service) and the actual secrets backend must be confirmed with the 
      platform/security team.
    kind: cloud
    inputs:
      fields:
        - id: redis_service_token
          type: string
          label: Redis Service Token
          secret: true
          help_text: Secret token identified by the credential name 'redis_service_token' in the proprietary CompanyInternal::SecretStore. Fetched by 
            mySecretFunction1 and stored in $service_token. Its downstream consumer (likely myapp or another on-node service) must be identified before 
            migration can be completed.
      required:
        - redis_service_token
    injectors:
      extra_vars:
        redis_service_token: !unsafe "{{ redis_service_token }}"
