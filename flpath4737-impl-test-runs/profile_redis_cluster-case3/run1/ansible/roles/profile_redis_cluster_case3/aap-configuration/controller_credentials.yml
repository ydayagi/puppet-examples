---
controller_credentials:
  - name: Company Internal Secret Store Redis Password - profile_redis_cluster_case3
    description: Redis server password sourced from the proprietary CompanyInternal::SecretStore, replacing the hardcoded 'CHANGEME' plaintext default. The 
      actual backend (Vault, AWS Secrets Manager, etc.) must be confirmed with the platform/security team.
    organization: Default
    credential_type: Company Internal Secret Store Redis Password
    update_secrets: true
    inputs:
      redis_password: "{{ vault_redis_password }}"
  - name: Company Internal Secret Store Redis Service Token - profile_redis_cluster_case3
    description: Service token named 'redis_service_token' fetched at catalog compile time via mySecretFunction1('redis_service_token') from 
      CompanyInternal::SecretStore. The downstream consumer (myapp or another on-node service) and the actual secrets backend must be confirmed with the 
      platform/security team.
    organization: Default
    credential_type: Company Internal Secret Store Redis Service Token
    update_secrets: true
    inputs:
      redis_service_token: "{{ vault_redis_service_token }}"
