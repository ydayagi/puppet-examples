---
# Converted from: ../../site/modules/linux/profile_redis_cluster/manifests/install.pp
# Installs and configures the Redis service.
# Replaces the unanalyzed community 'redis' Puppet class.
# redis_password is injected at runtime via AAP credential type.

- name: Install Redis package
  ansible.builtin.package:
    name: redis
    state: present

- name: Create Redis log directory
  ansible.builtin.file:
    path: "{{ profile_redis_cluster_case3_redis_log_dir }}" # noqa: R114 - path from role-defined variable, not user input
    state: directory
    owner: redis
    group: redis
    mode: "0755"

- name: Ensure Redis configuration directory exists
  ansible.builtin.file:
    path: /etc/redis
    state: directory
    owner: redis
    group: redis
    mode: "0750"

- name: Deploy Redis configuration
  ansible.builtin.template:
    src: redis.conf.j2
    dest: /etc/redis/redis.conf
    owner: redis
    group: redis
    mode: "0640"
    backup: true
  notify: Restart redis
  no_log: "{{ profile_redis_cluster_case3_secure_logging }}"

- name: Enable and start Redis service
  ansible.builtin.service:
    name: redis
    state: started
    enabled: true
