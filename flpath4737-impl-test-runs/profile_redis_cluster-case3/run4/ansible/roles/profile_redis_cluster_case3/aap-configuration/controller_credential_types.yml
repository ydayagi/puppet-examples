---
controller_credential_types:
  - name: Company Internal Secret Store Redis Service Token
    description: Service token fetched from the proprietary CompanyInternal::SecretStore via mySecretFunction1 using company_internal_lib
    kind: cloud
    inputs:
      fields:
        - id: secret_store_url
          type: string
          label: Secret Store URL
          help_text: URL or endpoint of the CompanyInternal::SecretStore backend (e.g., HashiCorp Vault, CyberArk, or internal HSM)
        - id: redis_service_token
          type: string
          label: Redis Service Token
          secret: true
          help_text: The named credential 'redis_service_token' fetched from CompanyInternal::SecretStore; written to /var/lib/redis/health_check.json
        - id: auth_token
          type: string
          label: Secret Store Authentication Token
          secret: true
          help_text: Authentication credential required to access the CompanyInternal::SecretStore backend API
      required:
        - redis_service_token
    injectors:
      extra_vars:
        secret_store_url: !unsafe "{{ secret_store_url }}"
        redis_service_token: !unsafe "{{ redis_service_token }}"
        auth_token: !unsafe "{{ auth_token }}"
  - name: Redis Password
    description: Redis requirepass password currently hardcoded as plaintext 'CHANGEME' in manifests/init.pp and rendered into redis.conf.erb; must be migrated 
      to Ansible Vault
    kind: cloud
    inputs:
      fields:
        - id: redis_password
          type: string
          label: Redis Password
          secret: true
          help_text: Password for Redis 'requirepass' directive (rendered into redis.conf as 'requirepass <value>'). Currently defaults to plaintext 'CHANGEME' 
            — must be replaced with an Ansible Vault encrypted value. File must be mode 0600 owned by redis.
      required:
        - redis_password
    injectors:
      extra_vars:
        redis_password: !unsafe "{{ redis_password }}"
