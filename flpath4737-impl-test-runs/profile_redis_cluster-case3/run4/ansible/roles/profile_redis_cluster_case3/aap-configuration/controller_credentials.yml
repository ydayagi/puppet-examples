---
controller_credentials:
  - name: Company Internal Secret Store Redis Service Token - profile_redis_cluster_case3
    description: Service token fetched from the proprietary CompanyInternal::SecretStore via mySecretFunction1 using company_internal_lib
    organization: Default
    credential_type: Company Internal Secret Store Redis Service Token
    update_secrets: true
    inputs:
      secret_store_url: "{{ secret_store_url }}"
      redis_service_token: "{{ vault_redis_service_token }}"
      auth_token: "{{ vault_auth_token }}"
  - name: Redis Password - profile_redis_cluster_case3
    description: Redis requirepass password currently hardcoded as plaintext 'CHANGEME' in manifests/init.pp and rendered into redis.conf.erb; must be migrated 
      to Ansible Vault
    organization: Default
    credential_type: Redis Password
    update_secrets: true
    inputs:
      redis_password: "{{ vault_redis_password }}"
