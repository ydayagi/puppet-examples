---
# Play 1: File and directory existence checks
- name: Verify files and directories
  hosts: all
  gather_facts: false
  tasks:
    - name: Stat key files and directories
      ansible.builtin.stat:
        path: "{{ item_path }}" # noqa: R114 - path from fixed test list, not user input
      loop:
        - /var/log/redis
        - /var/lib/redis/health_check.json
        - /opt/myapp
        - /opt/myapp/version.txt
        - /etc/redis/redis.conf
      loop_control:
        loop_var: item_path
      register: profile_redis_cluster_case3_stat_results

    - name: Assert all expected paths exist
      ansible.builtin.assert:
        that:
          - item_result['stat']['exists']
        fail_msg: "Expected path does not exist"
      loop: "{{ profile_redis_cluster_case3_stat_results['results'] }}"
      loop_control:
        loop_var: item_result

    - name: Assert /var/log/redis is a directory with correct mode
      ansible.builtin.assert:
        that:
          - profile_redis_cluster_case3_stat_results['results'][0]['stat']['isdir']
          - profile_redis_cluster_case3_stat_results['results'][0]['stat']['mode'] == '0755'
          - profile_redis_cluster_case3_stat_results['results'][0]['stat']['pw_name'] == 'redis'
          - profile_redis_cluster_case3_stat_results['results'][0]['stat']['gr_name'] == 'redis'
        fail_msg: "/var/log/redis directory ownership or mode is incorrect"

    - name: Assert /var/lib/redis/health_check.json has correct ownership and mode
      ansible.builtin.assert:
        that:
          - profile_redis_cluster_case3_stat_results['results'][1]['stat']['isreg']
          - profile_redis_cluster_case3_stat_results['results'][1]['stat']['mode'] == '0644'
          - profile_redis_cluster_case3_stat_results['results'][1]['stat']['pw_name'] == 'redis'
          - profile_redis_cluster_case3_stat_results['results'][1]['stat']['gr_name'] == 'redis'
        fail_msg: "/var/lib/redis/health_check.json ownership or mode is incorrect"

    - name: Assert /opt/myapp is a directory
      ansible.builtin.assert:
        that:
          - profile_redis_cluster_case3_stat_results['results'][2]['stat']['isdir']
        fail_msg: "/opt/myapp is not a directory"

    - name: Slurp /opt/myapp/version.txt
      ansible.builtin.slurp:
        src: /opt/myapp/version.txt
      register: profile_redis_cluster_case3_myapp_version_slurp

    - name: Assert myapp version.txt contains expected version
      ansible.builtin.assert:
        that:
          - (profile_redis_cluster_case3_myapp_version_slurp['content'] | b64decode | trim) == '2.1.0'
        fail_msg: "/opt/myapp/version.txt does not contain the expected version 2.1.0"

    - name: Slurp /var/lib/redis/health_check.json
      ansible.builtin.slurp:
        src: /var/lib/redis/health_check.json
      register: profile_redis_cluster_case3_health_check_slurp

    - name: Assert health_check.json is non-empty
      ansible.builtin.assert:
        that:
          - (profile_redis_cluster_case3_health_check_slurp['content'] | b64decode | trim) | length > 0
        fail_msg: "/var/lib/redis/health_check.json is empty"

# Play 2: Service and port checks
- name: Verify services and Redis port
  hosts: all
  gather_facts: false
  tasks:
    - name: Gather service facts
      ansible.builtin.service_facts:

    - name: Assert Redis service is active and enabled
      ansible.builtin.assert:
        that:
          - "'redis.service' in ansible_facts['services']"
          - ansible_facts['services']['redis.service']['state'] == 'running'
          - ansible_facts['services']['redis.service']['status'] == 'enabled'
        fail_msg: "Redis service is not running or not enabled"

    - name: Assert chronyd service is active and enabled
      ansible.builtin.assert:
        that:
          - "'chronyd.service' in ansible_facts['services']"
          - ansible_facts['services']['chronyd.service']['state'] == 'running'
          - ansible_facts['services']['chronyd.service']['status'] == 'enabled'
        fail_msg: "chronyd service is not running or not enabled"

    - name: Assert rsyslog service is active and enabled
      ansible.builtin.assert:
        that:
          - "'rsyslog.service' in ansible_facts['services']"
          - ansible_facts['services']['rsyslog.service']['state'] == 'running'
          - ansible_facts['services']['rsyslog.service']['status'] == 'enabled'
        fail_msg: "rsyslog service is not running or not enabled"

    - name: Assert Redis is listening on port 6379
      ansible.builtin.wait_for:
        host: 127.0.0.1
        port: 6379
        state: started
        timeout: 10
