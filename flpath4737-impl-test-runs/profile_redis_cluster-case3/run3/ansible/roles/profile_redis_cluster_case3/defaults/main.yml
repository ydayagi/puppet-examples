---
# Redis cluster configuration
profile_redis_cluster_case3_redis_port: 6379
# redis_password is injected by AAP credential type at runtime
profile_redis_cluster_case3_redis_bind: 0.0.0.0
profile_redis_cluster_case3_maxmemory_mb: 2048
profile_redis_cluster_case3_maxmemory_policy: allkeys-lru
profile_redis_cluster_case3_appendonly: true
profile_redis_cluster_case3_appendfsync: everysec
# myapp deployment configuration
profile_redis_cluster_case3_myapp_version: 2.1.0
profile_redis_cluster_case3_myapp_url: http://artifacts.internal/myapp-2.1.0.tar.gz
profile_redis_cluster_case3_myapp_install_dir: /opt/myapp
# Health check configuration
profile_redis_cluster_case3_health_check_url: http://localhost:8080/health
profile_redis_cluster_case3_health_check_file: /var/lib/redis/health_check.json
# Redis log directory
profile_redis_cluster_case3_log_dir: /var/log/redis
# Base OS profile toggles
profile_redis_cluster_case3_manage_ntp: true
profile_redis_cluster_case3_manage_syslog: true
profile_redis_cluster_case3_manage_utils: true
# Secure logging toggle — set to false only for debugging
profile_redis_cluster_case3_secure_logging: true
