---
argument_specs:
  main:
    short_description: Install and configure a Redis cluster node with base OS profile
    description:
      - Applies a base OS profile (NTP via chrony, syslog via rsyslog, optional utility packages).
      - Installs and configures a Redis instance as a cluster member.
      - Deploys the myapp companion application artifact.
      - Performs a health-check HTTP call and writes the result to a JSON file.
      - Detects whether the node is a Redis primary or replica.
      - Stubs Enterprise Scheduler registration (requires manual implementation).
    options:
      profile_redis_cluster_case3_redis_port:
        type: int
        required: false
        default: 6379
        description: TCP port Redis listens on.
      profile_redis_cluster_case3_redis_bind:
        type: str
        required: false
        default: 0.0.0.0
        description: IP address Redis binds to.
      profile_redis_cluster_case3_maxmemory_mb:
        type: int
        required: false
        default: 2048
        description: Maximum memory Redis is allowed to use, in megabytes.
      profile_redis_cluster_case3_maxmemory_policy:
        type: str
        required: false
        default: allkeys-lru
        description: Redis eviction policy when maxmemory is reached.
      profile_redis_cluster_case3_appendonly:
        type: bool
        required: false
        default: true
        description: Whether to enable Redis append-only persistence.
      profile_redis_cluster_case3_appendfsync:
        type: str
        required: false
        default: everysec
        description: Redis appendfsync mode (always, everysec, no).
      profile_redis_cluster_case3_myapp_version:
        type: str
        required: false
        default: 2.1.0
        description: Version of the myapp artifact to deploy.
      profile_redis_cluster_case3_myapp_url:
        type: str
        required: false
        default: http://artifacts.internal/myapp-2.1.0.tar.gz
        description: URL to download the myapp artifact tarball from.
      profile_redis_cluster_case3_myapp_install_dir:
        type: str
        required: false
        default: /opt/myapp
        description: Directory where myapp is installed.
      profile_redis_cluster_case3_health_check_url:
        type: str
        required: false
        default: http://localhost:8080/health
        description: URL for the health check HTTP GET request.
      profile_redis_cluster_case3_health_check_file:
        type: str
        required: false
        default: /var/lib/redis/health_check.json
        description: Path to write the health check JSON result.
      profile_redis_cluster_case3_log_dir:
        type: str
        required: false
        default: /var/log/redis
        description: Directory for Redis log files.
      profile_redis_cluster_case3_manage_ntp:
        type: bool
        required: false
        default: true
        description: Whether to install and enable chrony (NTP daemon).
      profile_redis_cluster_case3_manage_syslog:
        type: bool
        required: false
        default: true
        description: Whether to install and enable rsyslog.
      profile_redis_cluster_case3_manage_utils:
        type: bool
        required: false
        default: true
        description: Whether to install OS utility packages.
      profile_redis_cluster_case3_secure_logging:
        type: bool
        required: false
        default: true
        description: >-
          Controls no_log on tasks that handle secret credentials.
          Set to false only when debugging failing tasks — this will expose
          secrets in job output.
      redis_password:
        type: str
        required: true
        description: >-
          Redis requirepass password. Injected at runtime by the AAP credential
          type. Must be rotated from the default 'CHANGEME' value before deployment.
      secret_store_url:
        type: str
        required: true
        description: >-
          URL of the internal secret store. Injected at runtime by the AAP
          credential type.
      secret_store_auth_token:
        type: str
        required: true
        description: >-
          Authentication token for the internal secret store. Injected at
          runtime by the AAP credential type.
      redis_service_token:
        type: str
        required: true
        description: >-
          Service token for the Enterprise Scheduler registration. Injected at
          runtime by the AAP credential type. Used by the scheduler_registration
          tasks once manually implemented.
