---
controller_credentials:
  - name: Redis Password - profile_redis_cluster_case3
    description: Redis authentication password used as requirepass in redis.conf
    organization: Default
    credential_type: Redis Password
    update_secrets: true
    inputs:
      redis_password: "{{ vault_redis_password }}"
  - name: Company Internal Secret Store Service Token - profile_redis_cluster_case3
    description: Service token fetched from the proprietary CompanyInternal::SecretStore via mySecretFunction1 / company_internal_lib
    organization: Default
    credential_type: Company Internal Secret Store Service Token
    update_secrets: true
    inputs:
      secret_store_url: "{{ secret_store_url }}"
      secret_store_auth_token: "{{ vault_secret_store_auth_token }}"
      redis_service_token: "{{ vault_redis_service_token }}"
