---
controller_credential_types:
  - name: Redis Password
    description: Redis authentication password used as requirepass in redis.conf
    kind: cloud
    inputs:
      fields:
        - id: redis_password
          type: string
          label: Redis Password
          secret: true
          help_text: The Redis requirepass value. Defaults to 'CHANGEME' in the Puppet manifest — must be rotated and stored in Ansible Vault before deployment.
      required:
        - redis_password
    injectors:
      extra_vars:
        redis_password: !unsafe "{{ redis_password }}"
  - name: Company Internal Secret Store Service Token
    description: Service token fetched from the proprietary CompanyInternal::SecretStore via mySecretFunction1 / company_internal_lib
    kind: cloud
    inputs:
      fields:
        - id: secret_store_url
          type: string
          label: Secret Store URL
          help_text: Base URL or endpoint of the CompanyInternal::SecretStore backend (e.g., https://secrets.internal). Must be confirmed with the Platform
            Team.
        - id: secret_store_auth_token
          type: string
          label: Secret Store Authentication Token
          secret: true
          help_text: Authentication token or API key used by company_internal_lib to authenticate against CompanyInternal::SecretStore. Authentication mechanism
            is currently unknown and must be confirmed.
        - id: redis_service_token
          type: string
          label: Redis Service Token
          secret: true
          help_text: The named secret 'redis_service_token' retrieved from CompanyInternal::SecretStore via mySecretFunction1('redis_service_token'). Consumed
            downstream by myapp or the Enterprise Scheduler — exact usage must be clarified.
      required:
        - redis_service_token
    injectors:
      extra_vars:
        secret_store_url: !unsafe "{{ secret_store_url }}"
        secret_store_auth_token: !unsafe "{{ secret_store_auth_token }}"
        redis_service_token: !unsafe "{{ redis_service_token }}"
