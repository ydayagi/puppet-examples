---
controller_credential_types:
  - name: Redis Cluster Password
    description: Redis authentication password for the cluster node, currently a plaintext placeholder that must be vault-encrypted before production use
    kind: cloud
    inputs:
      fields:
        - id: redis_password
          type: string
          label: Redis Password
          secret: true
          help_text: The Redis requirepass value used for authenticating clients to the Redis cluster node (replaces plaintext 'CHANGEME' default)
      required:
        - redis_password
    injectors:
      extra_vars:
        redis_password: !unsafe "{{ redis_password }}"
  - name: Company Internal Secret Store Service Token
    description: Service token fetched from CompanyInternal::SecretStore via the proprietary company_internal_lib Ruby gem; backing secret store is unknown and 
      must be investigated before migration
    kind: cloud
    inputs:
      fields:
        - id: redis_service_token
          type: string
          label: Redis Service Token
          secret: true
          help_text: The 'redis_service_token' credential retrieved from CompanyInternal::SecretStore by mySecretFunction1; actual backend (HashiCorp Vault, AWS
            Secrets Manager, CyberArk, etc.) must be confirmed with the Platform/Security team
        - id: secret_store_url
          type: string
          label: Secret Store URL
          help_text: Connection URL or endpoint for the CompanyInternal::SecretStore backend once identified
        - id: secret_store_auth_token
          type: string
          label: Secret Store Authentication Token
          secret: true
          help_text: Authentication credential required to connect to the backing secret store (e.g., Vault token, AppRole secret, API key)
      required:
        - redis_service_token
    injectors:
      extra_vars:
        redis_service_token: !unsafe "{{ redis_service_token }}"
        secret_store_url: !unsafe "{{ secret_store_url }}"
        secret_store_auth_token: !unsafe "{{ secret_store_auth_token }}"
