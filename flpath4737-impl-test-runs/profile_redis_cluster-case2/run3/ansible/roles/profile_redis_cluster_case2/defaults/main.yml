---
# Redis cluster configuration
profile_redis_cluster_case2_redis_port: 6379
# redis_password is injected by AAP credential type at runtime
profile_redis_cluster_case2_redis_bind: 0.0.0.0
profile_redis_cluster_case2_maxmemory_mb: 2048
profile_redis_cluster_case2_maxmemory_policy: allkeys-lru
profile_redis_cluster_case2_appendonly: true
profile_redis_cluster_case2_appendfsync: everysec
# myapp deployment
profile_redis_cluster_case2_myapp_version: 2.1.0
profile_redis_cluster_case2_myapp_url: http://artifacts.internal/myapp-2.1.0.tar.gz
profile_redis_cluster_case2_myapp_install_dir: /opt/myapp
# Health check
profile_redis_cluster_case2_health_check_url: http://localhost:8080/health
profile_redis_cluster_case2_health_check_dest: /var/lib/redis/health_check.json
# Redis log directory
profile_redis_cluster_case2_log_dir: /var/log/redis
# Secure logging toggle — set to false only for debugging
profile_redis_cluster_case2_secure_logging: true
