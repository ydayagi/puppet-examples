---
# ---------------------------------------------------------------------------
# Play 1: Verify filesystem artefacts (config, log dir, health-check, myapp)
# ---------------------------------------------------------------------------
- name: Verify filesystem artefacts
  hosts: all
  gather_facts: false
  tasks:
    - name: Stat key filesystem paths
      ansible.builtin.stat:
        path: "{{ item_path }}" # noqa: R114 - paths are fixed literals from role-defined variables, not user input
      loop:
        - /etc/redis/redis.conf
        - /var/log/redis
        - /var/lib/redis/health_check.json
        - /opt/myapp
        - /opt/myapp/version.txt
      loop_control:
        loop_var: item_path
      register: redis_path_stat_results

    - name: Assert all expected paths exist
      ansible.builtin.assert:
        that:
          - item_stat['stat']['exists']
        fail_msg: "Expected path does not exist"
        success_msg: "Path exists as expected"
      loop: "{{ redis_path_stat_results['results'] }}"
      loop_control:
        loop_var: item_stat

    - name: Assert Redis log directory is a directory with correct mode
      ansible.builtin.assert:
        that:
          - redis_path_stat_results['results'][1]['stat']['isdir']
          - redis_path_stat_results['results'][1]['stat']['mode'] == '0755'
          - redis_path_stat_results['results'][1]['stat']['pw_name'] == 'redis'
          - redis_path_stat_results['results'][1]['stat']['gr_name'] == 'redis'
        fail_msg: "Redis log directory ownership or permissions are incorrect"
        success_msg: "Redis log directory ownership and permissions are correct"

    - name: Assert health-check JSON file has correct ownership and mode
      ansible.builtin.assert:
        that:
          - redis_path_stat_results['results'][2]['stat']['pw_name'] == 'redis'
          - redis_path_stat_results['results'][2]['stat']['gr_name'] == 'redis'
          - redis_path_stat_results['results'][2]['stat']['mode'] == '0644'
        fail_msg: "Health-check JSON file ownership or permissions are incorrect"
        success_msg: "Health-check JSON file ownership and permissions are correct"

    - name: Assert Redis config file has correct ownership and mode
      ansible.builtin.assert:
        that:
          - redis_path_stat_results['results'][0]['stat']['pw_name'] == 'redis'
          - redis_path_stat_results['results'][0]['stat']['gr_name'] == 'redis'
          - redis_path_stat_results['results'][0]['stat']['mode'] == '0640'
        fail_msg: "Redis config file ownership or permissions are incorrect"
        success_msg: "Redis config file ownership and permissions are correct"

    - name: Read myapp version file
      ansible.builtin.slurp:
        src: /opt/myapp/version.txt
      register: redis_myapp_version_slurp

    - name: Assert myapp version file contains expected version
      ansible.builtin.assert:
        that:
          - (redis_myapp_version_slurp['content'] | b64decode | trim) == '2.1.0'
        fail_msg: "myapp version.txt does not contain the expected version 2.1.0"
        success_msg: "myapp version.txt contains the expected version"

    - name: Read Redis configuration file
      ansible.builtin.slurp:
        src: /etc/redis/redis.conf
      register: redis_conf_slurp

    - name: Assert Redis configuration contains expected directives
      ansible.builtin.assert:
        that:
          - "'port 6379' in (redis_conf_slurp['content'] | b64decode)"
          - "'bind 0.0.0.0' in (redis_conf_slurp['content'] | b64decode)"
          - "'appendonly yes' in (redis_conf_slurp['content'] | b64decode)"
          - "'appendfsync everysec' in (redis_conf_slurp['content'] | b64decode)"
          - "'maxmemory-policy allkeys-lru' in (redis_conf_slurp['content'] | b64decode)"
          - "'logfile /var/log/redis/redis-server.log' in (redis_conf_slurp['content'] | b64decode)"
          - "'dir /var/lib/redis' in (redis_conf_slurp['content'] | b64decode)"
        fail_msg: "Redis configuration is missing one or more expected directives"
        success_msg: "Redis configuration contains all expected directives"

# ---------------------------------------------------------------------------
# Play 2: Verify Redis service state and connectivity
# ---------------------------------------------------------------------------
- name: Verify Redis service and connectivity
  hosts: all
  gather_facts: false
  tasks:
    - name: Gather service facts
      ansible.builtin.service_facts:

    - name: Assert Redis service is active and enabled
      ansible.builtin.assert:
        that:
          - "'redis.service' in ansible_facts['services'] or 'redis' in ansible_facts['services']"
          - >-
            ansible_facts['services']['redis.service']['state'] == 'running'
            or ansible_facts['services']['redis']['state'] == 'running'
        fail_msg: "Redis service is not running"
        success_msg: "Redis service is running"

    - name: Assert Redis port 6379 is listening
      ansible.builtin.wait_for:
        host: 127.0.0.1
        port: 6379
        state: started
        timeout: 10
