---
controller_credentials:
  - name: Redis Authentication Password - profile_redis_cluster_case2
    description: Redis requirepass authentication password, currently hardcoded as 'CHANGEME' and must be vaulted before Ansible deployment
    organization: Default
    credential_type: Redis Authentication Password
    update_secrets: true
    inputs:
      redis_password: "{{ vault_redis_password }}"
  - name: Company Internal Secret Store Service Token - profile_redis_cluster_case2
    description: Proprietary internal secret store credential used to fetch the redis_service_token via mySecretFunction1 / company_internal_lib. Backend is
      unknown and must be investigated with the Platform/Security team.
    organization: Default
    credential_type: Company Internal Secret Store Service Token
    update_secrets: true
    inputs:
      secret_store_url: "{{ secret_store_url }}"
      secret_store_token: "{{ vault_secret_store_token }}"
      redis_service_token: "{{ vault_redis_service_token }}"
