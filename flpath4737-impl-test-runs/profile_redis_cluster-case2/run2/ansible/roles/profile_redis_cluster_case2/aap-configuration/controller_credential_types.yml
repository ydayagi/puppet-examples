---
controller_credential_types:
  - name: Redis Authentication Password
    description: Redis requirepass authentication password, currently hardcoded as 'CHANGEME' and must be vaulted before Ansible deployment
    kind: cloud
    inputs:
      fields:
        - id: redis_password
          type: string
          label: Redis Password
          secret: true
          help_text: The Redis requirepass authentication password rendered into redis.conf via the template. Must replace the plaintext 'CHANGEME' default with
            a vault-encrypted value.
      required:
        - redis_password
    injectors:
      extra_vars:
        redis_password: !unsafe "{{ redis_password }}"
  - name: Company Internal Secret Store Service Token
    description: Proprietary internal secret store credential used to fetch the redis_service_token via mySecretFunction1 / company_internal_lib. Backend is
      unknown and must be investigated with the Platform/Security team.
    kind: cloud
    inputs:
      fields:
        - id: secret_store_url
          type: string
          label: Secret Store URL
          help_text: The endpoint URL of the CompanyInternal::SecretStore backend (e.g., Vault address, CyberArk URL, or AWS Secrets Manager endpoint). To be
            confirmed by the Security team.
        - id: secret_store_token
          type: string
          label: Secret Store Authentication Token
          secret: true
          help_text: Authentication token or credential used to authenticate against the CompanyInternal::SecretStore backend in order to retrieve secrets.
        - id: redis_service_token
          type: string
          label: Redis Service Token
          secret: true
          help_text: The secret value fetched by mySecretFunction1('redis_service_token') from CompanyInternal::SecretStore. Used as the service token for the
            Redis node, consumed implicitly by mySecretType1 for Enterprise Scheduler registration.
      required:
        - redis_service_token
    injectors:
      extra_vars:
        secret_store_url: !unsafe "{{ secret_store_url }}"
        secret_store_token: !unsafe "{{ secret_store_token }}"
        redis_service_token: !unsafe "{{ redis_service_token }}"
