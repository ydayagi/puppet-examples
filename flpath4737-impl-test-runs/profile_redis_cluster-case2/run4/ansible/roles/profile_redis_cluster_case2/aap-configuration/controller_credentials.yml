---
controller_credentials:
  - name: Redis Cluster Password - profile_redis_cluster_case2
    description: Redis authentication password used for requirepass configuration and client connections
    organization: Default
    credential_type: Redis Cluster Password
    update_secrets: true
    inputs:
      redis_password: "{{ vault_redis_password }}"
  - name: Company Internal Secret Store Service Token - profile_redis_cluster_case2
    description: Service token fetched from the proprietary CompanyInternal::SecretStore via mySecretFunction1. The underlying backend is unknown and must be
      identified before an Ansible lookup plugin can be selected.
    organization: Default
    credential_type: Company Internal Secret Store Service Token
    update_secrets: true
    inputs:
      redis_service_token: "{{ vault_redis_service_token }}"
      secret_store_url: "{{ secret_store_url }}"
      secret_store_auth_token: "{{ vault_secret_store_auth_token }}"
