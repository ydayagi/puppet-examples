---
controller_credential_types:
  - name: Redis Cluster Password
    description: Redis authentication password used for requirepass configuration and client connections
    kind: cloud
    inputs:
      fields:
        - id: redis_password
          type: string
          label: Redis Password
          secret: true
          help_text: The Redis requirepass password. Replaces the insecure plaintext default 'CHANGEME' from profile_redis_cluster::redis_password. Must be
            sourced from Ansible Vault or an external secrets manager — never stored in plaintext in role defaults or inventory.
      required:
        - redis_password
    injectors:
      extra_vars:
        redis_password: !unsafe "{{ redis_password }}"
  - name: Company Internal Secret Store Service Token
    description: Service token fetched from the proprietary CompanyInternal::SecretStore via mySecretFunction1. The underlying backend is unknown and must be
      identified before an Ansible lookup plugin can be selected.
    kind: cloud
    inputs:
      fields:
        - id: redis_service_token
          type: string
          label: Redis Service Token
          secret: true
          help_text: "The redis_service_token secret retrieved from CompanyInternal::SecretStore (company_internal_lib Ruby gem). The actual secret backend (e.g.,
            HashiCorp Vault, CyberArk, AWS Secrets Manager) is unknown — coordinate with the owning team to identify the backend and select the correct Ansible lookup
            plugin. Apply no_log: true to any task handling this value."
        - id: secret_store_url
          type: string
          label: Secret Store URL
          help_text: Connection URL or endpoint for the CompanyInternal::SecretStore backend. Required once the backend is identified.
        - id: secret_store_auth_token
          type: string
          label: Secret Store Authentication Token
          secret: true
          help_text: Authentication credential (token, AppRole secret, or equivalent) used to authenticate the Ansible lookup plugin against the
            CompanyInternal::SecretStore backend. Exact field depends on the backend identified by the owning team.
      required:
        - redis_service_token
    injectors:
      extra_vars:
        redis_service_token: !unsafe "{{ redis_service_token }}"
        secret_store_url: !unsafe "{{ secret_store_url }}"
        secret_store_auth_token: !unsafe "{{ secret_store_auth_token }}"
