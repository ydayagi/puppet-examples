---
controller_credential_types:
  - name: Redis Authentication
    description: Redis server authentication password used for requirepass configuration
    kind: cloud
    inputs:
      fields:
        - id: redis_password
          type: string
          label: Redis Password
          secret: true
          help_text: The Redis requirepass password. Defaults to 'CHANGEME' in the Puppet manifest — must be replaced with a real credential before production
            use.
      required:
        - redis_password
    injectors:
      extra_vars:
        redis_password: !unsafe "{{ redis_password }}"
  - name: Company Internal Secret Store Service Token
    description: Service token retrieved from the proprietary CompanyInternal::SecretStore via mySecretFunction1. Backend is unconfirmed — may be HashiCorp
      Vault, CyberArk, AWS Secrets Manager, or a custom internal API.
    kind: cloud
    inputs:
      fields:
        - id: redis_service_token
          type: string
          label: Redis Service Token
          secret: true
          help_text: The 'redis_service_token' secret fetched from CompanyInternal::SecretStore. The exact backend (Vault, CyberArk, AWS Secrets Manager, etc.)
            must be confirmed with the Platform Team before this field can be wired to the correct Ansible lookup plugin.
        - id: secret_store_url
          type: string
          label: Secret Store URL
          help_text: Base URL or endpoint of the CompanyInternal::SecretStore backend. Required once the backend is identified.
        - id: secret_store_auth_token
          type: string
          label: Secret Store Authentication Token
          secret: true
          help_text: Authentication credential (token, AppRole secret, API key, etc.) used to authenticate against the CompanyInternal::SecretStore backend.
            Exact field depends on the confirmed backend type.
      required:
        - redis_service_token
    injectors:
      extra_vars:
        redis_service_token: !unsafe "{{ redis_service_token }}"
        secret_store_url: !unsafe "{{ secret_store_url }}"
        secret_store_auth_token: !unsafe "{{ secret_store_auth_token }}"
