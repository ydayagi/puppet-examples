---
controller_credentials:
  - name: Redis Authentication - profile_redis_cluster_case2
    description: Redis server authentication password used for requirepass configuration
    organization: Default
    credential_type: Redis Authentication
    update_secrets: true
    inputs:
      redis_password: "{{ vault_redis_password }}"
  - name: Company Internal Secret Store Service Token - profile_redis_cluster_case2
    description: Service token retrieved from the proprietary CompanyInternal::SecretStore via mySecretFunction1. Backend is unconfirmed — may be HashiCorp
      Vault, CyberArk, AWS Secrets Manager, or a custom internal API.
    organization: Default
    credential_type: Company Internal Secret Store Service Token
    update_secrets: true
    inputs:
      redis_service_token: "{{ vault_redis_service_token }}"
      secret_store_url: "{{ secret_store_url }}"
      secret_store_auth_token: "{{ vault_secret_store_auth_token }}"
