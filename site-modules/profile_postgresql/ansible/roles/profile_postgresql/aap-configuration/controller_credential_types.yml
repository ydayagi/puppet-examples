---
controller_credential_types:
  - name: Company Internal Secret Store Service Token
    description: Credential for retrieving the postgres_service_token from the proprietary CompanyInternal::SecretStore via mySecretFunction1. Backend must be 
      confirmed with Platform Team (may be HashiCorp Vault, CyberArk, or AWS Secrets Manager).
    kind: cloud
    inputs:
      fields:
        - id: secret_store_url
          type: string
          label: Secret Store URL
          help_text: URL or endpoint of the CompanyInternal::SecretStore backend (e.g., Vault address or CyberArk endpoint)
        - id: secret_store_token
          type: string
          label: Secret Store Token
          secret: true
          help_text: Authentication token used to authenticate against the CompanyInternal::SecretStore backend
        - id: postgres_service_token
          type: string
          label: PostgreSQL Service Token
          secret: true
          help_text: The postgres_service_token secret fetched from CompanyInternal::SecretStore via mySecretFunction1('postgres_service_token')
      required:
        - secret_store_url
        - secret_store_token
        - postgres_service_token
    injectors:
      extra_vars:
        secret_store_url: !unsafe "{{ secret_store_url }}"
        secret_store_token: !unsafe "{{ secret_store_token }}"
        postgres_service_token: !unsafe "{{ postgres_service_token }}"
  - name: PostgreSQL Application Database
    description: Database credentials for the myapp application's PostgreSQL connection, sourced from Hiera eyaml-encrypted values (ENC[PKCS7,...]) across 
      environment levels.
    kind: cloud
    inputs:
      fields:
        - id: db_host
          type: string
          label: Database Host
          help_text: PostgreSQL server hostname (e.g., localhost for staging, db-primary.prod.internal for production)
        - id: db_port
          type: string
          label: Database Port
          help_text: "PostgreSQL server port (default: 5432)"
        - id: db_name
          type: string
          label: Database Name
          help_text: Name of the application database (e.g., myapp_db or testdb)
        - id: db_user
          type: string
          label: Database Username
          help_text: PostgreSQL role/user for the application (e.g., myapp_app or testuser)
        - id: db_password
          type: string
          label: Database Password
          secret: true
          help_text: Password for the application database user; stored as ENC[PKCS7,...] in Hiera eyaml (profile_app_stack::db_password); used in db_url, .env 
            file, and DB migration exec
      required:
        - db_host
        - db_port
        - db_name
        - db_user
        - db_password
    injectors:
      extra_vars:
        db_host: !unsafe "{{ db_host }}"
        db_port: !unsafe "{{ db_port }}"
        db_name: !unsafe "{{ db_name }}"
        db_user: !unsafe "{{ db_user }}"
        db_password: !unsafe "{{ db_password }}"
  - name: Application Secret Key
    description: Application-level secret key stored as ENC[PKCS7,...ProdSecret] in Hiera eyaml for production; used in the .env file rendered by app.env.erb.
    kind: cloud
    inputs:
      fields:
        - id: secret_key
          type: string
          label: Application Secret Key
          secret: true
          help_text: The SECRET_KEY value written to /opt/myapp-api/.env; stored as ENC[PKCS7,...ProdSecret] in production Hiera 
            (profile_app_stack::secret_key); defaults to 'changeme' if not set
      required:
        - secret_key
    injectors:
      extra_vars:
        secret_key: !unsafe "{{ secret_key }}"
