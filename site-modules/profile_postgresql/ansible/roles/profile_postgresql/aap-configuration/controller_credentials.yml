---
controller_credentials:
  - name: Company Internal Secret Store Service Token - profile_postgresql
    description: Credential for retrieving the postgres_service_token from the proprietary CompanyInternal::SecretStore via mySecretFunction1. Backend must be 
      confirmed with Platform Team (may be HashiCorp Vault, CyberArk, or AWS Secrets Manager).
    organization: Default
    credential_type: Company Internal Secret Store Service Token
    update_secrets: true
    inputs:
      secret_store_url: "{{ secret_store_url }}"
      secret_store_token: "{{ vault_secret_store_token }}"
      postgres_service_token: "{{ vault_postgres_service_token }}"
  - name: PostgreSQL Application Database - profile_postgresql
    description: Database credentials for the myapp application's PostgreSQL connection, sourced from Hiera eyaml-encrypted values (ENC[PKCS7,...]) across 
      environment levels.
    organization: Default
    credential_type: PostgreSQL Application Database
    update_secrets: true
    inputs:
      db_host: "{{ db_host }}"
      db_port: "{{ db_port }}"
      db_name: "{{ db_name }}"
      db_user: "{{ db_user }}"
      db_password: "{{ vault_db_password }}"
  - name: Application Secret Key - profile_postgresql
    description: Application-level secret key stored as ENC[PKCS7,...ProdSecret] in Hiera eyaml for production; used in the .env file rendered by app.env.erb.
    organization: Default
    credential_type: Application Secret Key
    update_secrets: true
    inputs:
      secret_key: "{{ vault_secret_key }}"
